name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check runtime errors
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: Build package
        if: matrix.python-version == '3.13'
        run: python -m build

      - name: Smoke-test installed package
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          agentweb2md --help
          agentweb2md-config --help
          agentweb2md-init --help
          agentweb2md-quality --help

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit dependencies
        run: python -m pip_audit --progress-spinner off

      - name: Scan source
        run: python -m bandit -q -lll -r . -x ./.git,./tests
